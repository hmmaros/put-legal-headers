<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="PutLegalHeaders hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120a"/>
      <stop offset="0.55" stop-color="#0a2315"/>
      <stop offset="1" stop-color="#0d2b18"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4ade80" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <circle cx="260" cy="170" r="170" fill="url(#glow)"/>

  <!-- stamp icon: handle + body -->
  <g transform="translate(260,175)">
    <rect x="-38" y="-72" width="76" height="22" rx="8" fill="#14532d"/>
    <rect x="-80" y="-50" width="160" height="130" rx="16" fill="url(#stamp)" stroke="#86efac" stroke-width="5"/>
    <circle cx="0" cy="8" r="34" fill="none" stroke="#06240f" stroke-width="4"/>
    <text x="0" y="22" text-anchor="middle" font-family="serif" font-size="58" font-weight="bold" fill="#06240f">©</text>
    <text x="0" y="66" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="3" fill="#06240f">LEGAL</text>
  </g>

  <text x="560" y="305" text-anchor="middle" font-family="monospace" font-size="96" font-weight="bold" fill="#4ade80" letter-spacing="2">PutLegalHeaders</text>
  <text x="560" y="362" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#bbf7d0">License scanning for the 3 a.m. crowd</text>

  <g transform="translate(370,410)">
    <rect width="380" height="40" rx="20" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="190" y="26" text-anchor="middle" font-family="monospace" font-size="17" letter-spacing="2" fill="#a7f3d0">LEGACY · CIRCA 2018</text>
  </g>

  <text x="1236" y="446" text-anchor="end" font-family="monospace" font-size="15" fill="#3f8f5a">config.json · cmd.exe · json-simple</text>
</svg>
