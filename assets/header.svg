<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-label="PutLegalHeaders hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04160e"/>
      <stop offset="0.55" stop-color="#07291b"/>
      <stop offset="1" stop-color="#063a25"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34d399" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <circle cx="640" cy="166" r="150" fill="url(#glow)"/>

  <!-- icon: rubber stamp -->
  <g transform="translate(640,166)">
    <rect x="-16" y="-80" width="32" height="26" rx="6" fill="#a7f3d0"/>
    <rect x="-52" y="-54" width="104" height="92" rx="12" fill="#052e16" stroke="#34d399" stroke-width="4"/>
    <circle cx="0" cy="-8" r="24" fill="none" stroke="#6ee7b7" stroke-width="3.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#6ee7b7">©</text>
    <text x="0" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#a7f3d0">LEGAL</text>
  </g>

  <text x="640" y="324" text-anchor="middle" font-family="monospace" font-size="84" font-weight="bold" fill="#6ee7b7" letter-spacing="1">PutLegalHeaders</text>
  <text x="640" y="372" text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#34d399" letter-spacing="8">AUTO</text>
  <text x="640" y="412" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#d1fae5">License scanning for the 3 a.m. crowd</text>

  <g transform="translate(44,420)">
    <rect width="252" height="34" rx="17" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text x="126" y="22" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="1" fill="#a7f3d0">LEGACY · 2018</text>
  </g>
  <text x="1236" y="442" text-anchor="end" font-family="monospace" font-size="20" font-weight="bold" fill="#34d399">hmmaros</text>
</svg>